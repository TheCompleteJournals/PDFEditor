<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Journal typer</title>
<style>
:root{--bg:#e9ecf2;--bar:#fff;--ink:#1a2233;--mut:#5b6578;--line:#d3d8e2;--acc:#2447d6;--onacc:#fff;--accbg:rgba(36,71,214,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--bar:#1b1f29;--ink:#e8ebf2;--mut:#9aa3b5;--line:#2d3342;--acc:#8ea2ff;--onacc:#101636;--accbg:rgba(142,162,255,.16)}}
:root[data-theme="dark"]{--bg:#12151c;--bar:#1b1f29;--ink:#e8ebf2;--mut:#9aa3b5;--line:#2d3342;--acc:#8ea2ff;--onacc:#101636;--accbg:rgba(142,162,255,.16)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.g{display:flex;align-items:center;gap:6px}
button,.btn{font:inherit;color:var(--ink);background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;display:inline-block}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc)}
input[type=range]{width:105px;accent-color:var(--acc)}
input[type=number]{width:54px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bar);color:var(--ink)}
.v{color:var(--mut);min-width:3.2em;font-variant-numeric:tabular-nums}
#file,#ld{position:absolute;opacity:0;width:1px;height:1px}
#desk{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-overflow-scrolling:touch}
.page{position:relative;background:#fff;box-shadow:0 1px 7px rgba(0,0,0,.28);flex:none;overflow:hidden}
.page canvas{display:block}
.lk,.bx{position:absolute;inset:0}.bx{pointer-events:none}
.lnk{position:absolute;display:block}
textarea{position:absolute;pointer-events:auto;margin:0;padding:0;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:#14267a;font-family:Helvetica,Arial,"Liberation Sans",Arimo,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
textarea.sel{background:rgba(36,71,214,.07);box-shadow:0 0 0 1px rgba(36,71,214,.45)}
#empty{margin:auto;text-align:center;max-width:360px;padding:24px}
#empty h1{font-size:20px;margin:0 0 8px}#empty p{color:var(--mut);margin:0 0 16px}
#msg{color:#c0392b;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style></head><body>
<header>
<div class="g"><label class="btn pri">Open PDF<input id="file" type="file" accept="application/pdf"></label></div>
<div class="g"><button id="fw" aria-pressed="true">Fit width</button><button id="fp" aria-pressed="false">Fit page</button><button id="zo" aria-label="Zoom out">−</button><span class="v" id="zl">100%</span><button id="zi" aria-label="Zoom in">+</button></div>
<div class="g"><label for="pg">Page</label><input id="pg" type="number" min="1" value="1"><span class="v" id="pc"></span></div>
<div class="g"><button id="snap" aria-pressed="true">Snap to lines</button></div>
<div class="g"><label for="sp">Line spacing</label><input id="sp" type="range" min="0.5" max="3" step="0.05" value="1"><span class="v" id="spv">×1.00</span></div>
<div class="g"><label for="sz">Text size</label><input id="sz" type="range" min="0.3" max="1" step="0.02" value="0.6"><span class="v" id="szv">60%</span></div>
<div class="g"><button id="del">Delete box</button></div>
<div class="g"><span class="v" id="ss" role="status"></span><button id="sv">Back up</button><label class="btn">Restore backup<input id="ld" type="file" accept=".json,application/json"></label><button id="dl" class="pri">Download PDF</button></div>
</header>
<main id="desk">
<div id="toast" role="status"></div>
<div id="empty"><h1>Type straight into your journal</h1><p>Open your journal PDF, then tap anywhere on a page to start typing. Text snaps to the ruled lines on its own. Your file stays on this device.</p><label class="btn pri">Choose PDF<input id="file2" type="file" accept="application/pdf"></label><div id="msg" role="alert"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $=s=>document.querySelector(s),desk=$('#desk');
const S={doc:null,pages:[],boxes:[],sel:null,fit:'width',zoom:1,snap:true,mult:1,sr:.6,W:0,r0:1.41,key:''};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const obs=new IntersectionObserver(es=>es.forEach(e=>{const p=S.pages[+e.target.dataset.i];if(e.isIntersecting)render(p);else if(p.on){p.tok++;p.on=false;p.cv.width=0}}),{root:desk,rootMargin:'900px 0px'});
function msg(t){const m=$('#msg');if(m)m.textContent=t}
async function openFile(f){
 if(!f)return;
 if(!window.pdfjsLib){msg('The PDF reader couldn’t load. Check your connection and reload.');return}
 try{const buf=await f.arrayBuffer();S.bytes=new Uint8Array(buf.slice(0));S.doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise}catch(e){msg('That file couldn’t be opened. Choose a PDF.');return}
 S.key='cj:'+f.name+':'+f.size;S.name=f.name;S.boxes=[];idbPut('last',{name:f.name,bytes:S.bytes}).catch(()=>{});try{navigator.storage.persist()}catch(_){}
 try{S.boxes=JSON.parse(localStorage.getItem(S.key)||'[]')}catch(e){}
 const v=(await S.doc.getPage(1)).getViewport({scale:1});S.r0=v.height/v.width;
 obs.disconnect();desk.innerHTML='';S.pages=[];S.sel=null;S.W=0;
 for(let i=0;i<S.doc.numPages;i++){
  const el=document.createElement('div');el.className='page';el.dataset.i=i;
  el.innerHTML='<canvas></canvas><div class="lk"></div><div class="bx"></div>';
  const p={n:i+1,el,cv:el.children[0],lk:el.children[1],bx:el.children[2],ratio:S.r0,lines:[],tok:0,on:false};
  el.onclick=e=>tap(p,e);desk.appendChild(el);S.pages.push(p)}
 S.boxes=S.boxes.filter(b=>S.pages[b.p-1]);S.boxes.forEach(mk);
 $('#pc').textContent='of '+S.doc.numPages;$('#pg').max=S.doc.numPages;layout(true)}
function layout(force){
 if(!S.doc)return;
 const aw=desk.clientWidth-24,ah=desk.clientHeight-24;
 const w=Math.max(240,Math.round((S.fit==='page'?Math.min(aw,ah/S.r0):aw)*S.zoom));
 $('#zl').textContent=Math.round(S.zoom*100)+'%';
 if(w===S.W&&!force)return;
 const keep=desk.scrollTop/(desk.scrollHeight||1);S.W=w;
 S.pages.forEach(p=>{p.el.style.width=w+'px';p.el.style.height=Math.round(w*p.ratio)+'px';p.tok++;p.on=false;p.cv.width=0;p.lk.innerHTML='';obs.unobserve(p.el);obs.observe(p.el)});
 S.boxes.forEach(place);desk.scrollTop=keep*desk.scrollHeight}
async function render(p){
 if(p.on)return;p.on=true;const t=++p.tok,W=S.W;
 try{
  const pg=await S.doc.getPage(p.n);if(t!==p.tok)return;
  const v1=pg.getViewport({scale:1}),sc=W/v1.width,dpr=Math.min(window.devicePixelRatio||1,2),v=pg.getViewport({scale:sc*dpr});
  p.ratio=v1.height/v1.width;const H=Math.round(W*p.ratio);p.el.style.height=H+'px';
  const cv=p.cv;cv.width=v.width;cv.height=v.height;cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  await pg.render({canvasContext:ctx,viewport:v}).promise;if(t!==p.tok)return;
  p.lines=detect(ctx,cv.width,cv.height,dpr);S.boxes.filter(b=>b.p===p.n).forEach(place);
  links(p,pg,sc,t)}catch(e){if(t===p.tok)p.on=false}}
function detect(ctx,w,h,dpr){
 const d=ctx.getImageData(0,0,w,h).data,tol=Math.round(3.5*dpr),dd=Math.max(3,Math.round(4*dpr)),st=w*4,out=[];let cur=null;
 for(let y=dd;y<h-dd;y++){
  let best=0,bs=0,be=0,run=0,rs=0,re=0,gap=0,o=y*st;
  for(let x=0;x<w;x++,o+=4){
   const v=d[o]+d[o+1]+d[o+2],a=d[o-dd*st]+d[o-dd*st+1]+d[o-dd*st+2],b=d[o+dd*st]+d[o+dd*st+1]+d[o+dd*st+2];
   if(a-v>=24&&b-v>=24){if(!run)rs=x;run+=gap+1;gap=0;re=x}
   else if(run){if(++gap>tol){if(run>best){best=run;bs=rs;be=re}run=0;gap=0}}}
  if(run>best){best=run;bs=rs;be=re}
  if(best>=.2*w){if(cur&&y-cur.last<=1){cur.last=y;if(best>cur.len){cur.len=best;cur.x0=bs;cur.x1=be}}else{cur={first:y,last:y,len:best,x0:bs,x1:be};out.push(cur)}}}
 return out.filter(c=>c.last-c.first+1<=5*dpr).map(c=>({y:(c.first+c.last+1)/2/w,x0:c.x0/w,x1:c.x1/w}))}
async function links(p,pg,sc,t){
 const v=pg.getViewport({scale:sc});let an=[];try{an=await pg.getAnnotations()}catch(e){}
 if(t!==p.tok)return;p.lk.innerHTML='';
 for(const a of an){
  if(a.subtype!=='Link'||(!a.dest&&!a.url))continue;
  const r=v.convertToViewportRectangle(a.rect),e=document.createElement('a');e.className='lnk';e.href='#';
  Object.assign(e.style,{left:Math.min(r[0],r[2])+'px',top:Math.min(r[1],r[3])+'px',width:Math.abs(r[2]-r[0])+'px',height:Math.abs(r[3]-r[1])+'px'});
  e.onclick=async ev=>{ev.preventDefault();if(a.url){window.open(a.url,'_blank','noopener');return}
   try{const d=typeof a.dest==='string'?await S.doc.getDestination(a.dest):a.dest;go(await S.doc.getPageIndex(d[0]))}catch(_){}};
  p.lk.appendChild(e)}}
function go(i){const el=S.pages[i].el;desk.scrollTo({top:el.getBoundingClientRect().top-desk.getBoundingClientRect().top+desk.scrollTop-12})}
function snapTo(p,fx,fy){
 const ls=p.lines.filter(l=>fx>=l.x0-.03&&fx<=l.x1+.03);if(!ls.length)return null;
 const ds=[];for(let i=1;i<ls.length;i++){const d=ls[i].y-ls[i-1].y;if(d>.012&&d<.12)ds.push(d)}
 ds.sort((a,b)=>a-b);const med=ds.length?ds[ds.length>>1]:.035;
 const i=ls.findIndex(l=>l.y>=fy-.25*med);if(i<0||ls[i].y-fy>1.3*med)return null;
 const nb=[ls[i+1]&&ls[i+1].y-ls[i].y,i>0&&ls[i].y-ls[i-1].y].filter(d=>d>.012&&d<.12);
 return{l:ls[i],sp:nb.length?Math.min(...nb):med}}
function span(p,L,sp,fx){
 const cv=p.cv,k=cv.width,ctx=cv.getContext('2d'),dpr=k/S.W,xt=Math.min(k-1,Math.max(0,Math.round(fx*k))),dl=Math.max(2,Math.round(1.5*dpr));
 const band=(yb,ref)=>{
  const strong=new Uint8Array(k),mod=new Uint8Array(k);let r0=ref;
  for(const f of [.25,.5,.75]){
   const y=Math.round((yb-f*sp)*k);if(y<0||y>=cv.height)continue;
   const d=ctx.getImageData(0,y,k,1).data;
   if(!r0)r0=[d[xt*4],d[xt*4+1],d[xt*4+2]];
   for(let x=0,o=0;x<k;x++,o+=4){
    if(Math.abs(d[o]-r0[0])+Math.abs(d[o+1]-r0[1])+Math.abs(d[o+2]-r0[2])>70)strong[x]=1;
    if(x>=dl&&x<k-dl){const a=(x-dl)*4,b=(x+dl)*4;if(Math.abs(d[b]+d[b+1]+d[b+2]-d[a]-d[a+1]-d[a+2])>=18)mod[x]=1}}}
  return{strong,mod,ref:r0}};
 const c=band(L.y,null),ns=[];
 for(const j of [-5,-4,-3,-2,-1,1,2,3,4,5]){const y=L.y+j*sp;if(y>sp*.5&&y<p.ratio-.01)ns.push(band(y,c.ref))}
 const near=(a,x)=>{for(let i=x-2;i<=x+2;i++)if(a[i])return 1;return 0};
 const hit=(b,x)=>near(b.mod,x)||near(b.strong,x);
 const need=Math.min(4,Math.ceil(ns.length/2));
 const blk=x=>(c.strong[x]&&(!ns.length||ns.some(b=>near(b.strong,x))))||(c.mod[x]&&ns.reduce((n,b)=>n+hit(b,x),0)>=need);
 const pad=Math.round(5*dpr);let l=-1,r=k;
 for(let x=xt-1;x>=0;x--)if(blk(x)){l=x;break}
 for(let x=xt+1;x<k;x++)if(blk(x)){r=x;break}
 return{x0:l<0?0:(l+pad)/k,x1:r>=k?1:(r-pad)/k}}
function tap(p,e){
 if(e.target.tagName==='TEXTAREA'||e.target.closest('.lnk'))return;
 const r=p.el.getBoundingClientRect(),fx=(e.clientX-r.left)/S.W,fy=(e.clientY-r.top)/S.W;
 S.boxes=S.boxes.filter(b=>{if(b.t)return true;b.el&&b.el.remove();return false});
 const b={p:p.n,x:fx,w:.3,by:0,base:.035,mult:S.mult,sr:S.sr,t:''},L=S.snap?snapTo(p,fx,fy):null;
 if(L){let s={x0:0,x1:1};try{s=span(p,L.l,L.sp,fx)}catch(_){}
  b.base=L.sp;const lf=Math.max(L.l.x0,s.x0),rt=Math.min(L.l.x1,s.x1);
  b.x=fx-lf<.06?lf:fx;b.w=Math.max(.04,rt-b.x);b.by=L.l.y-.12*b.base}else b.by=fy+.25*b.base;
 b.w=Math.min(b.w,.98-b.x);if(!L&&b.w<.1){b.x=.68;b.w=.3}
 S.boxes.push(b);mk(b).focus()}
function mk(b){
 const t=document.createElement('textarea');t.value=b.t;t.setAttribute('aria-label','Typed text');b.el=t;
 t.oninput=()=>{b.t=t.value;fit(b);save()};t.onfocus=()=>pick(b);
 S.pages[b.p-1].bx.appendChild(t);place(b);return t}
function place(b){
 const t=b.el;if(!t)return;const W=S.W,lh=b.base*b.mult,fs=b.base*b.sr;
 t.style.left=b.x*W+'px';t.style.top=(b.by-lh/2-.34*fs)*W+'px';t.style.width=b.w*W+'px';
 t.style.fontSize=fs*W+'px';t.style.lineHeight=lh*W+'px';fit(b)}
function fit(b){const t=b.el;t.style.height='0';t.style.height=Math.max(t.scrollHeight,b.base*b.mult*S.W)+'px'}
function pick(b){
 if(S.sel&&S.sel.el)S.sel.el.classList.remove('sel');S.sel=b;b.el.classList.add('sel');
 S.mult=b.mult;S.sr=b.sr;$('#sp').value=b.mult;$('#sz').value=b.sr;lab()}
function lab(){$('#spv').textContent='×'+(+$('#sp').value).toFixed(2);$('#szv').textContent=Math.round($('#sz').value*100)+'%'}
function upd(k,v){S[k]=v;if(S.sel){S.sel[k]=v;place(S.sel);save()}lab()}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(S.key,JSON.stringify(S.boxes.filter(b=>b.t).map(({p,x,by,w,base,mult,sr,t})=>({p,x,by,w,base,mult,sr,t}))));$('#ss').textContent='Saved on this device'}catch(e){$('#ss').textContent='Not saved: browser storage is blocked'}},300)}
$('#sp').oninput=e=>upd('mult',+e.target.value);
$('#sz').oninput=e=>upd('sr',+e.target.value);
$('#del').onclick=()=>{const b=S.sel;if(!b)return;b.el.remove();S.boxes=S.boxes.filter(x=>x!==b);S.sel=null;save()};
$('#snap').onclick=e=>{S.snap=!S.snap;e.target.setAttribute('aria-pressed',S.snap)};
function setFit(m){S.fit=m;S.zoom=1;$('#fw').setAttribute('aria-pressed',m==='width');$('#fp').setAttribute('aria-pressed',m==='page');layout(true)}
$('#fw').onclick=()=>setFit('width');$('#fp').onclick=()=>setFit('page');
$('#zi').onclick=()=>{S.zoom=Math.min(3,S.zoom*1.2);layout()};
$('#zo').onclick=()=>{S.zoom=Math.max(.5,S.zoom/1.2);layout()};
$('#pg').onchange=e=>{if(S.doc)go(Math.min(S.pages.length,Math.max(1,+e.target.value||1))-1)};
$('#file').onchange=e=>openFile(e.target.files[0]);$('#file2').onchange=e=>openFile(e.target.files[0]);
desk.ondragover=e=>e.preventDefault();desk.ondrop=e=>{e.preventDefault();openFile(e.dataTransfer.files[0])};
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>layout(),150)}).observe(desk);
let raf;desk.onscroll=()=>{if(raf||!S.doc)return;raf=requestAnimationFrame(()=>{raf=0;const top=desk.getBoundingClientRect().top+40;
 let i=S.pages.findIndex(p=>p.el.getBoundingClientRect().bottom>top);if(i<0)i=S.pages.length-1;
 if(document.activeElement!==$('#pg'))$('#pg').value=i+1})};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3500)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const base=()=>S.name.replace(/\.pdf$/i,'');
const slim=()=>S.boxes.filter(b=>b.t).map(({p,x,by,w,base,mult,sr,t})=>({p,x,by,w,base,mult,sr,t}));
$('#sv').onclick=()=>{
 if(!S.doc)return toast('Open your PDF first.');
 dl(new Blob([JSON.stringify({v:1,name:S.name,pages:S.doc.numPages,boxes:slim()})],{type:'application/json'}),base()+'-progress.json');
 toast('Backup downloaded. Use Restore backup to move your work to another device.')};
$('#ld').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!S.doc)return toast('Open your PDF first, then restore your backup.');
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.boxes))throw 0;
  if(d.pages&&d.pages!==S.doc.numPages)return toast('This backup belongs to a different PDF.');
  S.boxes.forEach(b=>b.el&&b.el.remove());S.sel=null;
  S.boxes=d.boxes.filter(b=>S.pages[b.p-1]&&b.t);S.boxes.forEach(mk);save();toast('Backup restored.')}
 catch(_){toast('That file isn’t a backup file.')}};
$('#dl').onclick=async()=>{
 if(!S.doc)return toast('Open your PDF first.');
 if(!window.PDFLib)return toast('The PDF writer couldn’t load. Check your connection and reload.');
 const bt=$('#dl');bt.disabled=true;bt.textContent='Preparing…';
 try{
  const{PDFDocument,StandardFonts,rgb}=PDFLib,pdf=await PDFDocument.load(S.bytes,{ignoreEncryption:true});
  const font=await pdf.embedFont(StandardFonts.Helvetica),pgs=pdf.getPages(),ink=rgb(.078,.149,.478);
  const ok=c=>{try{font.encodeText(c);return true}catch(_){return false}};
  for(const b of slim()){
   const pg=pgs[b.p-1],mb=pg.getMediaBox(),pw=mb.width,fs=b.base*b.sr*pw,lh=b.base*b.mult*pw,mw=b.w*pw,lines=[];
   const wd=s=>font.widthOfTextAtSize(s,fs);
   for(const para of [...b.t].map(c=>c==='\n'||ok(c)?c:'?').join('').split('\n')){
    let cur='';
    for(const word of para.split(' ')){
     const t=cur?cur+' '+word:word;
     if(wd(t)<=mw||!cur){cur=t;while(wd(cur)>mw&&cur.length>1){let i=cur.length-1;while(i>1&&wd(cur.slice(0,i))>mw)i--;lines.push(cur.slice(0,i));cur=cur.slice(i)}}
     else{lines.push(cur);cur=word}}
    lines.push(cur)}
   lines.forEach((l,i)=>{if(l.trim())pg.drawText(l,{x:mb.x+b.x*pw,y:mb.y+mb.height-(b.by*pw+i*lh),size:fs,font,color:ink})})}
  dl(new Blob([await pdf.save()],{type:'application/pdf'}),base()+'-filled.pdf');toast('Your PDF has been downloaded.')}
 catch(e){toast('The PDF couldn’t be created. Try again.')}
 bt.disabled=false;bt.textContent='Download PDF'};
lab();
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('jt',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
(async()=>{try{const r=await idbGet('last');if(r){await openFile(new File([r.bytes],r.name,{type:'application/pdf'}));if(S.doc)toast('Welcome back. Your journal and typing are restored.')}}catch(_){}})();
